name: UbuntuHub API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore UbuntuHub.Api/UbuntuHub.Api.slnx

      - name: Build solution
        run: dotnet build UbuntuHub.Api/UbuntuHub.Api.slnx --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test UbuntuHub.Api/UbuntuHub.Api.slnx --no-build --configuration Release